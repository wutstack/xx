[ai]
model = "claude-sonnet-5-5"
effort = "medium"
timeout_seconds = 600
max_budget_usd = 1.0

[[grant]]
action = "ai.run"
resource = "worktree:T-20261108-65b6c3"

[[grant]]
action = "ai.review"
resource = "worktree:T-20261108-65b6c3"

[[grant]]
action = "check.run"
resource = "check:*"

[[grant]]
action = "git.commit"
resource = "branch:task/T-20261108-65b6c3"

[[grant]]
action = "git.push"
resource = "branch:task/T-20261108-65b6c3"

[[grant]]
action = "pr.create_draft"
